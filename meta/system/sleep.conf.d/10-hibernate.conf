# Turn a long sleep on battery into a hibernate.
#
# niri-power-action calls `systemctl suspend-then-hibernate`, which suspends
# to RAM first and then writes the image to disk once HibernateDelaySec has
# passed. A lid closed on battery therefore sleeps at ten minutes and, if it
# stays shut, hibernates ninety minutes later instead of quietly flattening
# the battery overnight.
#
# HibernateOnACPower=no keeps a machine on mains from ever hibernating on its
# own, which suits the lid rules — on mains nothing suspends in the first place.
#
# Hibernation already works on this machine and needs no further setup:
# resume=UUID=... is on the kernel cmdline and /dev/nvme0n1p2 is a 20G swap
# partition against 14G of RAM. Worth testing by hand at least once anyway
# (`systemctl hibernate`), because zram runs close to full here and the image
# has to carry those pages too.
#
# Not installable by stow: it belongs to root under /etc. See the README.
#
#   sudo install -Dm644 meta/system/sleep.conf.d/10-hibernate.conf \
#     /etc/systemd/sleep.conf.d/10-hibernate.conf

[Sleep]
HibernateDelaySec=90min
HibernateOnACPower=no
