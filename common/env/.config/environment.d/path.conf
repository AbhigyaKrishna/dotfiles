# Put ~/.local/bin on PATH for the graphical session.
#
# Shell rc files do not help here: systemd user units and anything launched
# from the compositor never source them. Steam is the case that matters —
# its launch options call `gamerun` by name, so if this directory is missing
# from the session PATH the game does not start at all, with nothing more
# informative than "gamerun: not found" buried in the Steam log.
#
# It happens to already be on PATH on this machine, inherited from the login
# chain rather than from anything tracked here. This file makes that explicit
# so a fresh machine does not quietly lose it, and so common/bin can be relied
# on by name.
#
# Applied by systemd --user at session start; run `systemctl --user
# show-environment | grep PATH` to check, and note it needs a re-login rather
# than a daemon-reload to take effect.

PATH=${HOME}/.local/bin:${PATH}
