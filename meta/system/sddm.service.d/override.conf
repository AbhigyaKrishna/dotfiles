# Let the user session inherit the kernel session keyring.
#
# systemd services default to KeyringMode=private, which gives sddm a session
# keyring of its own, so a PAM module that puts a secret there at login leaves
# the user session unable to see it.
#
# This was installed for pam_kwallet, which is no longer in the picture — the
# session consolidated on gnome-keyring, and kwallet-pam is uninstalled. The
# setting is kept because pam_gnome_keyring's auto-unlock is the remaining
# consumer of the inherited keyring, but that has NOT been re-verified against
# `private` since the switch. If keyring auto-unlock ever needs debugging,
# check whether this line is still doing anything before assuming it is.
#
# Not installable by stow: it belongs to root under /etc. See the README.
#
#   sudo install -Dm644 meta/system/sddm.service.d/override.conf \
#     /etc/systemd/system/sddm.service.d/override.conf
#   sudo systemctl daemon-reload

[Service]
KeyringMode=inherit
