# TLP, as a source of two device tweaks only — not as the power manager.
#
# power-profiles-daemon owns power management here: the noctalia bar's
# PowerProfile widget talks to it, and meta/system/udev/99-power-profile.rules
# drives it on charger changes. TLP and power-profiles-daemon are mutually
# exclusive as profile managers, so tlp.service stays DISABLED. Enabling it
# makes the two fight over the governor and the platform profile, and TLP will
# say so itself in `tlp-stat -s`.
#
# What is left is these two settings, which are not profile settings and do not
# overlap with anything power-profiles-daemon touches. Both switch a power
# saving feature off:
#
#   SOUND_POWER_SAVE_ON_AC=0  the HDA codec sleeping on AC, which pops and
#                             clips the first moment of playback
#   USB_AUTOSUSPEND=0         USB devices being suspended, which drops input
#                             devices and dongles mid-use
#
# These live in a drop-in rather than in /etc/tlp.conf because tlp.conf is a
# pacman backup file: editing it means a .pacnew to reconcile on every update,
# and two real settings buried in 400 lines of commented defaults. The
# directory is TLP's own intended path for this — see /etc/tlp.d/README.
#
# CAVEAT: with tlp.service disabled, nothing applies these at boot. They take
# effect only when TLP is run by hand (`sudo tlp start`, or tlpui). See the
# README for what that costs and how to make them stick without TLP.
#
# Not installable by stow: it belongs to root under /etc. See the README.
#
#   sudo install -Dm644 meta/system/tlp.d/10-local.conf \
#     /etc/tlp.d/10-local.conf
#   sudo tlp start

SOUND_POWER_SAVE_ON_AC=0
USB_AUTOSUSPEND=0
