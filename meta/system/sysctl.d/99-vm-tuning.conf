# /etc/sysctl.d/99-vm-tuning.conf
# Memory-subsystem tuning to reduce swap thrashing on a RAM-constrained box.
#
# This file was ineffective while zram was on: cachyos-settings'
# 30-zram.rules sets vm.swappiness=150 from udev when zram0 initialises, which
# lands after sysctl.d and wins. With zram gone (meta/system/zram-generator.conf)
# the value below is the one in force — `sysctl vm.swappiness` should say 100.
#
#   sudo install -Dm644 meta/system/sysctl.d/99-vm-tuning.conf \
#     /etc/sysctl.d/99-vm-tuning.conf

# Less eager to evict anonymous pages than the CachyOS default of 150.
# zswap absorbs most swap-outs in RAM, so 100 is still cheap, but it stops
# pushing working-set pages out so early.
vm.swappiness = 100

# Re-enable light proactive compaction so THP=madvise allocations don't stall
# waiting on reactive compaction under fragmentation. 0 = fully off (default here).
vm.compaction_proactiveness = 20
