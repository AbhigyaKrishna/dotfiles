# Turn zswap on at boot: a compressed RAM cache in front of the disk swap.
#
# The kernel ships with it off here (CachyOS expects zram instead — see
# meta/system/zram-generator.conf for why that is gone). compressor=zstd and
# shrinker_enabled=Y are already the defaults on this kernel and are restated
# so a kernel update that changes them is caught here, not by a slow machine.
# The shrinker is the part that matters: it writes cold pages from the pool out
# to disk, so the pool keeps the warm ones instead of filling and stalling.
#
# max_pool_percent=25 caps the pool at ~3.7G of RAM; at the ~3:1 ratio zstd was
# getting on zram that is ~11G of swapped pages served without touching disk.
#
# sysfs, not the kernel cmdline, so it lives with the rest of meta/system and
# needs no limine regeneration. systemd-tmpfiles-setup runs early in boot,
# before anything has been swapped out. Not installable by stow:
#
#   sudo install -Dm644 meta/system/tmpfiles.d/zswap.conf \
#     /etc/tmpfiles.d/zswap.conf
#
# Check with `grep . /sys/module/zswap/parameters/*` and, under load,
# `sudo grep . /sys/kernel/debug/zswap/*` (stored_pages, written_back_pages).

w /sys/module/zswap/parameters/compressor       - - - - zstd
w /sys/module/zswap/parameters/max_pool_percent - - - - 25
w /sys/module/zswap/parameters/shrinker_enabled - - - - Y
w /sys/module/zswap/parameters/enabled          - - - - Y
