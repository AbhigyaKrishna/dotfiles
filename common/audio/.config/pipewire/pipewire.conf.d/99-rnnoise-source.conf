# RNNoise noise-suppression microphone filter.
#
# Registered as a WirePlumber "smart filter". Because filter.smart.target is
# deliberately left unset, WirePlumber attaches this to whatever the *default
# source* currently is -- so it cleans up the Bluetooth headset mic while the
# headset is connected, and follows over to the laptop mic when it is not.
# Nothing has to be re-selected by hand when the headset connects/disconnects.
#
# Forced to mono because the two mics disagree on channel count (headset HFP is
# 1ch, the internal array is 2ch) and noise_suppressor_mono takes one channel.
#
# Requires: noise-suppression-for-voice
context.modules = [
  { name = libpipewire-module-filter-chain
    # nofail/ifexists: if noise-suppression-for-voice is missing, skip this
    # module quietly instead of taking the whole audio stack down at boot.
    flags = [ ifexists nofail ]
    args = {
      node.description = "Noise Canceling Source"
      media.name       = "Noise Canceling Source"
      filter.graph = {
        nodes = [
          {
            type   = ladspa
            name   = rnnoise
            plugin = /usr/lib/ladspa/librnnoise_ladspa.so
            label  = noise_suppressor_mono
            control = {
              "VAD Threshold (%)"          = 50.0
              "VAD Grace Period (ms)"      = 200
              "Retroactive VAD Grace (ms)" = 0
            }
          }
        ]
      }
      capture.props = {
        node.name      = "rnnoise_capture"
        node.passive   = true
        audio.rate     = 48000
        audio.channels = 1
        audio.position = [ MONO ]
      }
      playback.props = {
        node.name        = "rnnoise_source"
        media.class      = Audio/Source
        filter.smart     = true
        filter.smart.name = rnnoise
        audio.rate       = 48000
        audio.channels   = 1
        audio.position   = [ MONO ]
      }
    }
  }
]
