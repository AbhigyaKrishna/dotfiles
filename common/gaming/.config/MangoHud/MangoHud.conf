# MangoHud — overlay tuned to answer "is this actually running well, and on
# what?" rather than to list everything it can print.
#
# gpu_name earns its place on this machine: it is hybrid, Vulkan enumerates the
# Vega iGPU first, and a game launched without PRIME offload lands there
# silently. Seeing "NVIDIA GeForce RTX 3050" in the corner is the quickest
# confirmation that gamerun did its job.
#
# fps_metrics gives average plus 1% and 0.1% lows, which is what actually
# corresponds to felt stutter — an average of 90 hides a 22 fps low, and on a
# 14G machine under memory pressure those lows are the thing to watch.
#
# Toggle in game with Shift_R+F12; the frame timing graph is Shift_L+F11.

legacy_layout=false
gpu_stats
gpu_name
gpu_temp
gpu_load_change
gpu_load_value=60,90
gpu_load_color=39F900,FDFD09,B22222
vram

cpu_stats
cpu_temp
cpu_load_change
cpu_load_value=60,90
cpu_load_color=39F900,FDFD09,B22222
core_load_change

ram
# This box has 14G and lives close to its limit — swap in the overlay makes it
# obvious when a stutter is memory rather than GPU.
swap

fps
fps_metrics=avg,0.01,0.001
frametime
frame_timing=1
histogram

# Which API and resolution actually ended up in use, which is not always what
# was asked for once gamescope and Proton have both had a turn.
engine_version
vulkan_driver
resolution

font_size=20
background_alpha=0.4
position=top-left
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
