# How long memory pressure must hold before systemd-oomd acts.
#
# Pairs with the app.slice drop-in in common/systemd, which sets the 50%
# threshold; this sets how long that threshold has to be exceeded. Twenty
# seconds is short enough to save an interactive session from a thrash and
# long enough that a heavy but finite build is not killed for being heavy.
#
# Not installable by stow: it belongs to root under /etc. See the README.
#
#   sudo install -Dm644 meta/system/oomd.conf.d/10-pressure.conf \
#     /etc/systemd/oomd.conf.d/10-pressure.conf
#   sudo systemctl restart systemd-oomd

[OOM]
DefaultMemoryPressureDurationSec=20s
