# Let the user session inherit the kernel session keyring.
#
# systemd services default to KeyringMode=private, which gives sddm a session
# keyring of its own. pam_kwallet puts the wallet password into that keyring at
# login, so under `private` the user session never sees it and kwallet cannot
# auto-unlock. That in turn breaks ksshaskpass, and with it the SSH_ASKPASS and
# GIT_ASKPASS flow this configuration relies on for ssh and git.
#
# Not installable by stow: it belongs to root under /etc. See the README.
#
#   sudo install -Dm644 meta/system/sddm.service.d/override.conf \
#     /etc/systemd/system/sddm.service.d/override.conf
#   sudo systemctl daemon-reload

[Service]
KeyringMode=inherit
