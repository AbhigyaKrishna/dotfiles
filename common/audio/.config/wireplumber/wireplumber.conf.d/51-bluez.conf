# Bluetooth audio quality settings.
#
# Note on the ZEB-PARADISE headset mic: it is stuck at 8 kHz CVSD and cannot be
# improved. Its HFP handshake reports AT+BRSF=031, and bit 7 (codec
# negotiation) is unset, so the headset never offers mSBC wideband -- this is a
# headset-side limitation, identical on every OS. Independently, this Realtek
# RTL8852 adapter (usb 0bda:2852) does not support the USB ALT6 transparent-SCO
# setting that mSBC would need anyway. enable-msbc is kept on so that a future
# headset that *does* support codec negotiation gets wideband automatically.
#
# enable-sbc-xq is the setting that actually helps today: higher-bitrate SBC
# for A2DP playback.
monitor.bluez.properties = {
  bluez5.enable-msbc      = true
  bluez5.enable-sbc-xq    = true
  bluez5.enable-hw-volume = true
  bluez5.hfphsp-backend   = "native"
  bluez5.roles = [ a2dp_sink a2dp_source hsp_hs hsp_ag hfp_hf hfp_ag ]
}
