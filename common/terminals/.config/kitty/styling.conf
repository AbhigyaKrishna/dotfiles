# vim:fileencoding=utf-8:ft=kitty
# ============================================================================
#  Custom styling — the ricing layer on top of the stock template.
#
#  kitty.conf stays the pristine, fully-commented upstream reference so
#  `kitten choose-fonts` and the docs still line up. All personal overrides
#  live here and are pulled in via `include styling.conf` at the end of
#  kitty.conf, AFTER `include current-theme.conf` so tab colours below win.
# ============================================================================

#: Fonts ---------------------------------------------------------------------
#  JetBrainsMono Nerd Font Mono — installed via `ttf-jetbrains-mono-nerd`.
#  The "Mono" variant forces every icon glyph to a single cell so nothing
#  overlaps at the prompt. Ligatures stay on (disable_ligatures never).
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

disable_ligatures never

#: Window layout -------------------------------------------------------------
window_padding_width    12
placement_strategy      center
hide_window_decorations yes
confirm_os_window_close  0

#: Transparency + blur -------------------------------------------------------
#  0.92 to sit just under Noctalia's bar (0.93) so the stack reads as one
#  material. NOTE: background_blur needs a compositor that implements the KDE
#  blur protocol; niri does not, so under niri you get the transparency but
#  not an actual blur. Harmless, and future-proof if that ever changes.
background_opacity          0.92
background_blur             1
dynamic_background_opacity  yes

#: Cursor --------------------------------------------------------------------
cursor_shape                 beam
cursor_beam_thickness        1.6
cursor_blink_interval        0.5 ease-in-out
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

#: Tab bar -------------------------------------------------------------------
#  Powerline, slanted, anchored at the top. Active tab picks up the blue
#  accent (#6f8fdb) that the rest of the "One" scheme trends toward.
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_title_template      "{index}: {title}"
active_tab_foreground   #0e1415
active_tab_background   #6f8fdb
active_tab_font_style   bold
inactive_tab_foreground #b8b8b8
inactive_tab_background #1a2122
inactive_tab_font_style normal
tab_bar_background      none

#: Misc polish ---------------------------------------------------------------
scrollback_lines  10000
url_style         curly
enable_audio_bell no
