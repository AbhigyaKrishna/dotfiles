# Let systemd-oomd kill a runaway application before the machine locks up.
#
# This box has 14G of RAM and lives under real memory pressure — /proc/pressure
# showed full avg300 around 7%, meaning ~7% of any five minutes every task was
# stalled waiting on memory, with zram saturated on top. Without a userspace
# OOM killer the next spike is a hard freeze: the kernel OOM killer only acts
# once allocation actually fails, long after the desktop stops responding.
#
# It is scoped to app.slice on purpose. niri runs in session.slice and the
# systemd user manager puts every app it launches in its own scope under
# app.slice (app-niri-kitty-2970.scope and so on), so oomd can only ever pick
# an application here — it structurally cannot kill the compositor or the
# session. That per-app scoping is also why oomd beats earlyoom on this setup:
# it takes out one whole app cleanly rather than one process of it.
#
# Memory pressure, not swap usage, is the trigger. Swap-based killing is the
# other common recipe and it would be actively wrong here: zram runs at ~97%
# by design, so a swap threshold would fire constantly during normal use.
#
# Needs systemd-oomd.service enabled — see meta/systemd-system-units.txt — and
# the duration in meta/system/oomd.conf.d/10-pressure.conf.

[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
