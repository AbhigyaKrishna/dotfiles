# Local TLP settings.
#
# TLP is the power manager here — see the power section of meta/packages.txt
# for why it rather than power-profiles-daemon. Everything else TLP does comes
# from its own defaults; these are the four places this machine disagrees with
# them. The first three switch a power saving feature off:
#
#   SOUND_POWER_SAVE_ON_AC=0  the HDA codec sleeping on AC, which pops and
#                             clips the first moment of playback
#   USB_AUTOSUSPEND=0         USB devices being suspended, which drops input
#                             devices and dongles mid-use — including USB
#                             Bluetooth radios
#   WIFI_PWR_ON_BAT=off       wifi power saving on battery (TLP defaults it to
#                             "on"), which adds latency and stalls long-lived
#                             connections. That matters because closing the lid
#                             no longer suspends: the session stays up for ten
#                             minutes on battery, and downloads, SSH sessions
#                             and syncs are expected to survive it. See the
#                             lock and lid section of the README.
#
# The fourth goes the other way — it turns a power saving feature back ON,
# because on this chassis the aggressive setting is a thermal liability:
#
#   CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
#
# TLP defaults this to "performance" on AC. Under amd-pstate-epp that is a hint
# straight to the CPU's internal governor, and "performance" means the 5600H
# takes every boost opportunity it is offered and holds it. On a desktop that is
# free speed. Here it is not: the cooling in this Pavilion Gaming chassis cannot
# carry sustained max boost, so the part climbs to Tctl 95°C — its Tjmax — and
# throttles. Measured at the desktop with no game running, just a long-lived
# node process and dockerd, Tctl sat at 94–96°C with the CPU pinned at 4.09 GHz.
#
# balance_performance still boosts readily; it simply stops treating maximum
# frequency as free. The part spends less time against the thermal wall, which
# on a thermally limited laptop tends to RAISE sustained clocks rather than
# lower them — you lose a little peak and stop falling off the cliff.
#
# This deliberately does not touch the battery side (TLP already defaults it to
# "power"), and it does not fight gamemode. gamemode asks for the performance
# GOVERNOR for the duration of a game, which overrides the EPP hint while the
# game runs — see common/gaming/.config/gamemode.ini. So this setting governs
# the desktop and the background-load case, which is where the 96°C was
# actually measured. What protects the machine DURING a game is the hard
# junction-temperature cap set by ryzenadj-thermal.service, not this line.
#
# TLP sets no DEVICES_TO_DISABLE_* rules, so wifi and Bluetooth are never
# rfkill'd out from under the session; only power saving needed disabling.
#
# These live in a drop-in rather than in /etc/tlp.conf because tlp.conf is a
# pacman backup file: editing it means a .pacnew to reconcile on every update,
# and three real settings buried in 400 lines of commented defaults. The
# directory is TLP's own intended path for this — see /etc/tlp.d/README. Note
# that /etc/tlp.conf overrides this directory, so the settings must not also
# be set there.
#
# Applied at boot by tlp.service, which meta/systemd-system-units.txt enables.
#
# Not installable by stow: it belongs to root under /etc. See the README.
#
#   sudo install -Dm644 meta/system/tlp.d/10-local.conf \
#     /etc/tlp.d/10-local.conf
#   sudo tlp start

SOUND_POWER_SAVE_ON_AC=0
USB_AUTOSUSPEND=0
WIFI_PWR_ON_BAT=off
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
