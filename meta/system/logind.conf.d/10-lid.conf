# Hand lid handling to niri instead of logind.
#
# noctalia has no logind integration, so HandleLidSwitch=lock would turn the
# display off without ever locking the session. niri's switch-events block
# (desktop/niri/.config/niri/cfg/lid.kdl) calls niri-power-action instead,
# which locks first and only suspends when the battery requires it.
#
# Install:
#   sudo install -Dm644 meta/system/logind.conf.d/10-lid.conf \
#     /etc/systemd/logind.conf.d/10-lid.conf
#   sudo systemctl restart systemd-logind    # NOTE: ends the graphical session
#
# These override the same keys in /etc/systemd/logind.conf; drop-ins win, and
# survive package updates that rewrite the main file.

[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
