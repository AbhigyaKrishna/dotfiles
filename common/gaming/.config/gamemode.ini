# gamemode — what to change for the duration of a game, and nothing more.
#
# This matters more here than on a typical desktop because TLP is the power
# manager and is deliberately conservative. gamemode raises the governor for
# the session and puts it back afterwards, which is exactly the shape of thing
# TLP is not meant to do.
#
# One caveat worth knowing: TLP re-applies its settings when the power source
# changes. Plugging in or unplugging mid-game therefore resets the governor
# underneath gamemode, and the fix is simply to not do that, or to relaunch.
#
# Deliberately absent: the [gpu] section. gamemode can raise NVIDIA's
# powermizer mode and apply clock offsets, but that needs
# apply_gpu_optimisations=accept-responsibility and is overclocking on a laptop
# cooler. The governor and scheduling changes below carry almost none of that
# risk and most of the benefit.

[general]
; Renice the game so a background build cannot starve it.
renice=10

; Ask for the performance governor while a game is running, restoring the
; previous one on exit.
desiredgov=performance
defaultgov=powersave

; Soft realtime scheduling only when the core count makes it safe.
softrealtime=auto

; Give the game priority on I/O too — this machine swaps under pressure.
ioprio=0

; Stop the screen blanking mid-cutscene. niri-power-action still handles the
; lid, so this does not keep a closed laptop awake.
inhibit_screensaver=1
