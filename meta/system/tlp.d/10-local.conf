# Local TLP settings.
#
# TLP is the power manager here — see the power section of meta/packages.txt
# for why it rather than power-profiles-daemon. Everything else TLP does comes
# from its own defaults; these are the three places this machine disagrees with
# them. All three switch a power saving feature off:
#
#   SOUND_POWER_SAVE_ON_AC=0  the HDA codec sleeping on AC, which pops and
#                             clips the first moment of playback
#   USB_AUTOSUSPEND=0         USB devices being suspended, which drops input
#                             devices and dongles mid-use — including USB
#                             Bluetooth radios
#   WIFI_PWR_ON_BAT=off       wifi power saving on battery (TLP defaults it to
#                             "on"), which adds latency and stalls long-lived
#                             connections. That matters because closing the lid
#                             no longer suspends: the session stays up for ten
#                             minutes on battery, and downloads, SSH sessions
#                             and syncs are expected to survive it. See the
#                             lock and lid section of the README.
#
# TLP sets no DEVICES_TO_DISABLE_* rules, so wifi and Bluetooth are never
# rfkill'd out from under the session; only power saving needed disabling.
#
# These live in a drop-in rather than in /etc/tlp.conf because tlp.conf is a
# pacman backup file: editing it means a .pacnew to reconcile on every update,
# and three real settings buried in 400 lines of commented defaults. The
# directory is TLP's own intended path for this — see /etc/tlp.d/README. Note
# that /etc/tlp.conf overrides this directory, so the settings must not also
# be set there.
#
# Applied at boot by tlp.service, which meta/systemd-system-units.txt enables.
#
# Not installable by stow: it belongs to root under /etc. See the README.
#
#   sudo install -Dm644 meta/system/tlp.d/10-local.conf \
#     /etc/tlp.d/10-local.conf
#   sudo tlp start

SOUND_POWER_SAVE_ON_AC=0
USB_AUTOSUSPEND=0
WIFI_PWR_ON_BAT=off
