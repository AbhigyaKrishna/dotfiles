# smartd configuration — /etc/smartd.conf
#
# Replaces the distro default (a bare `DEVICESCAN`, which monitors drives but
# has no alert path and runs no self-tests). This machine has a documented
# reason to care: the SATA SSD at /dev/sda threw catastrophic I/O errors and
# dropped off the bus once already. smartd is the thing that warns BEFORE that
# happens again, not after.
#
# One directive, applied to every SMART-capable drive DEVICESCAN finds
# (currently /dev/nvme0 and /dev/sda):
#
#   -a            monitor everything smartd knows how to (all attributes,
#                 health, error and self-test logs)
#   -o on         enable automatic offline data collection on the drive
#   -S on         enable attribute autosave, so values survive power cycles
#   -s (S/.. L/..) schedule self-tests: a SHORT test daily at 02:00, a LONG
#                 test weekly on Saturday at 03:00. The machine is on 24/7, so
#                 these always run; the long test is what surfaces bad sectors
#                 the drive has not been asked to read yet.
#   -m <nomailer> disable the email alert path (no MTA on this box)...
#   -M exec ...   ...and route alerts through smartd-notify instead, which logs
#                 to journald and pops a critical desktop notification. Install
#                 it at /usr/local/bin/smartd-notify (see meta/system/).
#   -M test       fire one alert through that path every time smartd starts, so
#                 a reboot doubles as a wiring test. Harmless on a machine that
#                 rarely reboots; drop this token once you have seen it work.
#
# Install and enable (not stowable — it is root's under /etc, and the handler
# lives in /usr/local/bin):
#
#   sudo install -Dm755 meta/system/smartd-notify /usr/local/bin/smartd-notify
#   sudo install -Dm644 meta/system/smartd.conf   /etc/smartd.conf
#   sudo systemctl enable --now smartd.service
#
# Verify the whole chain without waiting for a real fault: `-M test` means a
# notification should appear the moment the service starts. If it does not,
# check `journalctl -t smartd` — the journald line lands regardless.

DEVICESCAN -a -o on -S on -s (S/../.././02|L/../../6/03) -m <nomailer> -M exec /usr/local/bin/smartd-notify -M test
