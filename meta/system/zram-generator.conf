# /etc/systemd/zram-generator.conf — deliberately defines NO devices.
#
# zram is off on this machine; zswap in front of the disk swap replaces it (see
# tmpfiles.d/zswap.conf). With both in place the two fought: zram (7.5G, ~3:1
# zstd) filled early with cold pages and then sat there, so every later
# eviction went straight to the NVMe partition — the slow tier ended up
# holding the recently-used pages and the fast tier the stale ones. zswap is a
# write-back cache instead: hot pages stay compressed in RAM, cold ones are
# shrunk out to disk, so the order stays right as pressure grows.
#
# A file with no [zramN] section creates no device and overrides the package's
# /usr/lib/systemd/zram-generator.conf (zram-size = ram). It also keeps
# cachyos-settings' /usr/lib/udev/rules.d/30-zram.rules from firing, which
# otherwise forces vm.swappiness=150 and switches zswap off whenever zram0
# comes up — that rule is why sysctl.d/99-vm-tuning.conf never took effect.
#
# zram holds ~7G of swapped pages at runtime and cannot be swapped off with
# ~3G free, so this takes a reboot. Install before the swapfile/zswap ones:
#
#   sudo install -Dm644 meta/system/zram-generator.conf \
#     /etc/systemd/zram-generator.conf
